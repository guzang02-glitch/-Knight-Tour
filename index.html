<title>기사의 여행</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one-screen portrait app. Top bar, knight's speech bubble, square board filling the rest, three pill buttons.
   Single committed daytime-meadow look (pastel + thick plum outlines), same in light and dark hosts. */
:root {
  --ink: #3B2F57;
  --ink-soft: #6E6487;
  --sky: #BFE7FF;
  --mint: #DDF7E8;
  --grass-a: #AEE283;
  --grass-b: #98D56E;
  --pink: #FF7FA8;
  --pink-deep: #EC5A8C;
  --gold: #FFD45C;
  --paper: #FFFFFF;
  --lilac: #E9E4F7;
  --scrim: rgba(59, 47, 87, .45);
  --f-display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: linear-gradient(180deg, var(--sky) 0%, var(--mint) 100%);
  color: var(--ink);
  font-family: var(--f-body);
  overflow: hidden;
  overscroll-behavior: none;            /* no pull-to-refresh / bounce while playing */
  touch-action: manipulation;           /* no double-tap zoom */
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}
img { -webkit-user-drag: none; }
.cloud {
  position: fixed; z-index: 0; pointer-events: none;
  width: 140px; height: 44px; border-radius: 44px;
  background: var(--paper); opacity: .75;
  animation: drift 60s linear infinite;
}
.cloud::before, .cloud::after { content: ""; position: absolute; background: var(--paper); border-radius: 50%; }
.cloud::before { width: 60px; height: 60px; left: 22px; top: -28px; }
.cloud::after { width: 46px; height: 46px; left: 70px; top: -18px; }
.cloud.c1 { top: 9%; left: -160px; }
.cloud.c2 { top: 30%; left: -160px; transform: scale(.7); animation-duration: 85s; animation-delay: -40s; }
.cloud.c3 { top: 70%; left: -160px; transform: scale(.85); animation-duration: 75s; animation-delay: -20s; }
@keyframes drift { to { translate: calc(100vw + 320px) 0; } }

/* Mobile-first portrait column: HUD → knight talk → board (fills width) → thumb-zone action bar */
.app {
  position: relative; z-index: 1;
  height: 100%; max-width: 480px; margin: 0 auto;
  box-sizing: border-box;
  padding-inline: 16px; padding-block: 10px 8px;
  display: flex; flex-direction: column; gap: 12px;
}

/* top HUD */
.top { display: flex; align-items: center; gap: 8px; }
.stage-btn {
  font-family: var(--f-display); font-size: 18px; color: var(--ink);
  background: var(--gold); border: 3px solid var(--ink); border-radius: 14px;
  box-shadow: 0 4px 0 var(--ink); padding: 0 10px; min-height: 44px; cursor: pointer;
  display: flex; align-items: center; gap: 4px; white-space: nowrap;
}
.stage-btn small { font-size: 12px; opacity: .75; }
.stage-btn .chev { font-size: 12px; margin-left: 2px; }
.stage-btn { cursor: default; }   /* indicator only: stages are played in order */
.progress {
  flex: 1; min-width: 0;
  background: var(--paper); border: 3px solid var(--ink); border-radius: 999px;
  height: 38px; position: relative; overflow: hidden;
  box-shadow: 0 4px 0 var(--ink);
}
.progress .label img { width: 20px; height: 20px; }
.progress .fill {
  position: absolute; inset: 0 auto 0 0; width: 0%;
  background: repeating-linear-gradient(-45deg, var(--pink) 0 10px, #FF94B7 10px 20px);
  transition: width .3s ease;
}
.progress .label {
  position: relative; height: 100%; white-space: nowrap;
  display: flex; align-items: center; justify-content: center; gap: 4px;
  font-family: var(--f-display); font-size: 16px; font-variant-numeric: tabular-nums;
}

/* knight talk: portrait + speech bubble */
.talk { display: flex; align-items: center; gap: 10px; }
.avatar {
  flex: none; width: 56px; height: 56px; border-radius: 50%; overflow: hidden;
  background: var(--lilac); border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink);
}
.avatar img { width: 100%; height: 160%; object-fit: cover; object-position: 50% 0; display: block; }
.bubble {
  position: relative; flex: 1; min-width: 0; background: var(--paper);
  border: 3px solid var(--ink); border-radius: 16px;
  padding: 8px 12px; min-height: 56px; box-sizing: border-box;
  display: flex; align-items: center;
  font-size: 15px; line-height: 1.35;
}
.bubble::after {
  content: ""; position: absolute; left: -10px; top: 50%; width: 14px; height: 14px;
  background: var(--paper); border-left: 3px solid var(--ink); border-bottom: 3px solid var(--ink);
  transform: translateY(-50%) rotate(45deg);
}
.bubble.pop { animation: bubblePop .25s ease; }
@keyframes bubblePop { 50% { transform: scale(1.03); } }

/* board */
/* board sits low, near the thumbs; spare height opens up as sky above it */
.stage-area { flex: 1; min-height: 0; display: grid; place-items: end center; padding-bottom: 6px; }
.board-frame {
  border: 4px solid var(--ink); border-radius: 18px; background: var(--grass-b);
  box-shadow: 0 6px 0 var(--ink);
}
.board { position: relative; cursor: pointer; touch-action: manipulation; }
.g, .ct { position: absolute; left: calc(var(--x) * var(--c)); top: calc(var(--y) * var(--c)); width: var(--c); height: var(--c); }
.g.a { background: var(--grass-a); }
.g.b { background: var(--grass-b); }
/* round only the corner tiles so the knight can overhang the board edge */
.g.tl { border-top-left-radius: 14px; } .g.tr { border-top-right-radius: 14px; }
.g.bl { border-bottom-left-radius: 14px; } .g.br { border-bottom-right-radius: 14px; }
.trail { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.trail polyline { fill: none; stroke: var(--paper); stroke-width: .07; stroke-dasharray: .1 .14; stroke-linecap: round; stroke-linejoin: round; opacity: .85; }
.ct { display: grid; place-items: center; pointer-events: none; }
.ct > *, .ct::after { grid-area: 1 / 1; }
.ct img { width: 86%; height: 86%; object-fit: contain; user-select: none; }
.ct .goal { width: 96%; height: 96%; animation: goalBob 1.4s ease-in-out infinite; }
@keyframes goalBob { 50% { transform: translateY(-4%); } }
.ct .flower {
  width: 84%; height: 84%; position: relative; display: grid; place-items: center;
  animation: bloom .45s cubic-bezier(.3, 1.6, .5, 1) both;
}
.ct .flower img { width: 100%; height: 100%; }
.ct .flower span {
  position: absolute; font-family: var(--f-display); line-height: 1;
  font-size: calc(var(--c) * .22); color: var(--ink); font-variant-numeric: tabular-nums;
}
/* chess gimmick cells: standing on one, the next move uses that piece */
.ct .piece {
  width: 72%; height: 72%; display: grid; place-items: center; box-sizing: border-box;
  border: 3px solid var(--ink); border-radius: 50%; background: var(--pc);
  font-size: calc(var(--c) * .46); line-height: 1; color: var(--ink);
  box-shadow: 0 3px 0 var(--ink); animation: pieceBob 1.6s ease-in-out infinite;
}
.ct .piece.K { --pc: #ffe08a; } .ct .piece.R { --pc: #ffc2d6; } .ct .piece.B { --pc: #d9cff7; }
.ct .piece.mini {
  width: 34%; height: 34%; font-size: calc(var(--c) * .2); border-width: 2px; box-shadow: none; animation: none;
  justify-self: end; align-self: start; margin: 2%; z-index: 1;
}
@keyframes pieceBob { 50% { transform: translateY(-5%); } }
@keyframes bloom { from { transform: scale(0) rotate(-90deg); } to { transform: scale(1) rotate(0); } }
.ct.mark::after {
  content: ""; width: 36%; height: 36%; border-radius: 50%;
  background: var(--paper); border: 3px solid var(--ink); box-sizing: border-box;
  animation: pulse 1s ease-in-out infinite alternate;
}
.ct.hint::after {
  width: 52%; height: 52%; background: var(--gold);
  box-shadow: 0 0 0 6px rgba(255, 212, 92, .45);
  animation: hintPulse .6s ease-in-out infinite alternate;
}
.ct.wrong::after {
  content: ""; width: 40%; height: 40%; border-radius: 50%; box-sizing: border-box;
  background: #F2727A; border: 3px solid var(--ink);
  background-image: linear-gradient(45deg, transparent 44%, var(--paper) 44%, var(--paper) 56%, transparent 56%),
                    linear-gradient(-45deg, transparent 44%, var(--paper) 44%, var(--paper) 56%, transparent 56%);
}
@keyframes pulse { from { transform: scale(.8); opacity: .75; } to { transform: scale(1); opacity: 1; } }
@keyframes hintPulse { from { transform: scale(.85) rotate(0); } to { transform: scale(1.1) rotate(20deg); } }
.ct.shake { animation: shake .3s ease; }
@keyframes shake { 25% { transform: translateX(-6%); } 75% { transform: translateX(6%); } }

/* knight */
#knight { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 5; will-change: transform; }
.kflip { width: 100%; height: 100%; transform: scaleX(var(--face, 1)); transition: transform .15s; }
.kbob { width: 100%; height: 100%; animation: bob 1.6s ease-in-out infinite; }
.ksq { position: relative; width: 100%; height: 100%; transform-origin: 50% 95%; }
.ksq img {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: contain; object-position: 50% 100%;
  filter: drop-shadow(0 2px 0 rgba(59, 47, 87, .25));
}
.kshadow { position: absolute; left: 24%; right: 24%; bottom: -3%; height: 9%; border-radius: 50%; background: rgba(59, 47, 87, .22); }
@keyframes bob { 50% { transform: translateY(-3%); } }
.mood { display: none; }
[data-mood="normal"] .m-normal, [data-mood="jump"] .m-jump,
[data-mood="sad"] .m-sad, [data-mood="happy"] .m-happy { display: block; }

/* thumb-zone action bar: big round icon buttons, hint in the middle */
.controls {
  display: flex; justify-content: space-evenly; align-items: flex-end;
  padding-top: 2px;
}
.act {
  position: relative; background: none; border: 0; padding: 0; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 76px;
  font-family: var(--f-display); font-size: 14px; color: var(--ink);
}
.act img { width: 64px; height: 64px; filter: drop-shadow(0 4px 0 rgba(59, 47, 87, .35)); transition: transform .08s; }
.act.main img { width: 80px; height: 80px; }
.act:active img { transform: translateY(3px) scale(.94); }
.act[aria-disabled="true"] { opacity: .4; }
.act.nudge img { animation: nudge .7s ease-in-out infinite; }
@keyframes nudge { 50% { transform: translateY(-6px) scale(1.08); } }
.act .count {
  position: absolute; top: 0; right: 4px;
  font-size: 14px; background: var(--pink-deep); color: var(--paper);
  border: 3px solid var(--paper); border-radius: 999px; min-width: 28px; height: 28px; box-sizing: border-box;
  display: grid; place-items: center; box-shadow: 0 2px 0 var(--ink);
}
/* top-right exit button, same chunky style as the stage button */
.exit-btn {
  flex: none; width: 42px; height: 42px; padding: 0; cursor: pointer;
  background: var(--paper); border: 3px solid var(--ink); border-radius: 14px;
  box-shadow: 0 4px 0 var(--ink); display: grid; place-items: center;
}
.exit-btn svg { width: 22px; height: 22px; fill: none; stroke: var(--ink); stroke-width: 3.5; stroke-linecap: round; }
.exit-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.daily-btn { position: relative; }
.stage-btn small { font-variant-numeric: tabular-nums; }
.app.daily .progress .label img { display: none; }
.app.daily .stage-btn { background: var(--pink); color: var(--paper); }
.daily-btn svg { stroke-width: 2.4; }
.daily-btn .star { fill: var(--gold); stroke: var(--ink); stroke-width: 1.2; }
.daily-btn .dot {
  position: absolute; top: -4px; right: -4px; width: 12px; height: 12px; border-radius: 50%;
  background: var(--pink-deep); border: 2px solid var(--paper);
}
.daily-hints { font-family: var(--f-display); font-size: 15px; color: var(--ink) !important; background: var(--gold); border-radius: 10px; padding: 4px 12px; }
.daily-list { display: flex; flex-direction: column; gap: 10px; width: 100%; }
.daily-row {
  display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; text-align: left;
  border: 3px solid var(--ink); border-radius: 14px; padding: 10px 12px; background: var(--paper);
}
.daily-row.done { background: #FFF1F5; }
.daily-row b { font-family: var(--f-display); font-weight: 400; font-size: 18px; display: block; }
.daily-row small { color: var(--ink-soft); font-size: 13px; }
.daily-row .btn { min-height: 40px; padding: 6px 12px; font-size: 15px; box-shadow: 0 3px 0 var(--ink); }
.rank-tabs { display: flex; gap: 6px; width: 100%; }
.rank-tabs button {
  flex: 1; font-family: var(--f-display); font-size: 15px; color: var(--ink); cursor: pointer;
  background: var(--lilac); border: 3px solid var(--ink); border-radius: 12px; padding: 6px 0;
}
.rank-tabs button[aria-selected="true"] { background: var(--gold); }
.rank-list { list-style: none; margin: 0; padding: 0; width: 100%; max-height: 44vh; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
.rank-list li {
  display: grid; grid-template-columns: 34px 30px 1fr auto; gap: 8px; align-items: center; text-align: left;
  border: 2px solid var(--lilac); border-radius: 12px; padding: 6px 10px; font-size: 14px;
}
.rank-list li.me { border-color: var(--pink-deep); background: #FFF1F5; }
.rank-list .no { font-family: var(--f-display); font-size: 17px; text-align: center; }
.rank-list img { width: 28px; height: 28px; border-radius: 50%; }
.rank-list .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank-list .sc { font-variant-numeric: tabular-nums; color: var(--ink-soft); }
.rank-list .empty { display: block; border: 0; text-align: center; color: var(--ink-soft); }
.rank-line { font-family: var(--f-display); font-size: 16px; color: var(--ink) !important; }
.overlay.ended { background: linear-gradient(180deg, var(--sky) 0%, var(--mint) 100%); z-index: 26; }
/* out of hints: the badge turns into an ad marker */
.act.ad .count { background: var(--gold); color: var(--ink); font-size: 11px; padding: 0 5px; }
.reward {
  font-family: var(--f-display); font-size: 15px; color: var(--ink) !important;
  background: var(--gold); border: 3px solid var(--ink); border-radius: 999px; padding: 4px 14px;
}
.ad-art { width: 84px; height: 84px; }
.ad-play { font-size: 14px; }
.ad-play-screen { background: rgba(20, 14, 32, .92); z-index: 25; }
.ad-box { color: #fff; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.ad-box p { margin: 0; font-size: 16px; }
.ad-box strong { font-family: var(--f-display); font-size: 56px; font-weight: 400; }
.ad-tag { font-size: 12px; border: 2px solid #fff; border-radius: 6px; padding: 2px 6px; }
/* popup buttons */
.btn {
  font-family: var(--f-display); font-size: 18px; color: var(--ink);
  background: var(--paper); border: 3px solid var(--ink); border-radius: 999px;
  box-shadow: 0 4px 0 var(--ink); padding: 10px 6px; min-height: 52px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn.pink { background: var(--pink); color: var(--paper); }
button:focus-visible { outline: 3px solid var(--pink-deep); outline-offset: 3px; }

/* overlays */
.overlay {
  position: fixed; inset: 0; z-index: 20; background: var(--scrim);
  display: grid; place-items: center; padding: 16px;
}
.card {
  width: min(380px, 100%); box-sizing: border-box;
  background: var(--paper); border: 4px solid var(--ink); border-radius: 24px;
  box-shadow: 0 8px 0 var(--ink); padding: 20px 18px;
  display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;
  animation: cardIn .4s cubic-bezier(.3, 1.5, .5, 1);
}
@keyframes cardIn { from { transform: scale(.6); opacity: 0; } }
.card h2 { font-family: var(--f-display); font-weight: 400; font-size: 28px; margin: 0; text-wrap: balance; }
.card p { margin: 0; color: var(--ink-soft); font-size: 15px; }
.card .art { width: 120px; height: 170px; animation: cheer .8s ease-in-out infinite alternate; }
.card .art img { width: 100%; height: 100%; object-fit: contain; }
@keyframes cheer { to { transform: translateY(-8px) rotate(3deg); } }
.stats { display: flex; gap: 8px; }
.stats span {
  font-family: var(--f-display); font-size: 14px; background: var(--lilac);
  border-radius: 10px; padding: 4px 10px; font-variant-numeric: tabular-nums;
}
.card .actions { display: flex; flex-direction: column; gap: 10px; width: 100%; }
/* stage select as a bottom sheet */
.overlay.sheet { place-items: end center; padding: 0; }
.overlay.sheet .card {
  width: 100%; max-width: 480px; border-radius: 26px 26px 0 0; border-bottom: 0; box-shadow: none;
  padding: 10px 16px calc(16px + env(safe-area-inset-bottom, 0px));
  animation: sheetIn .28s cubic-bezier(.2, .9, .3, 1);
}
@keyframes sheetIn { from { transform: translateY(100%); } }
.grab { width: 44px; height: 5px; border-radius: 3px; background: var(--lilac); }
.stage-grid {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; width: 100%;
  max-height: 56vh; overflow-y: auto; padding: 4px 4px 8px; box-sizing: border-box;
  overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
}
.stage-grid button {
  aspect-ratio: 1; max-width: 100%;
  font-family: var(--f-display); font-size: 18px; color: var(--ink);
  background: var(--lilac); border: 3px solid var(--ink); border-radius: 12px;
  box-shadow: 0 3px 0 var(--ink); cursor: pointer; position: relative; padding: 0;
}
.stage-grid button.done { background: var(--pink); color: var(--paper); }
.stage-grid button.cur { background: var(--gold); color: var(--ink); }
.stage-grid button small { position: absolute; left: 0; right: 0; bottom: 2px; font-size: 10px; opacity: .8; }
.legend { font-size: 13px; color: var(--ink-soft); }
.stage-grid button .tag {
  position: absolute; top: -9px; left: 50%; transform: translateX(-50%);
  font-style: normal; font-size: 10px; line-height: 1; white-space: nowrap;
  padding: 3px 5px; border-radius: 6px; border: 2px solid var(--ink);
}
.stage-grid button.hurdle .tag { background: var(--pink-deep); color: var(--paper); }
.stage-grid button.long .tag { background: var(--gold); color: var(--ink); }
.stage-grid button.hurdle { border-width: 4px; }
.stage-grid { padding-top: 12px; row-gap: 14px; }

/* metrics view (#metrics): one row per collected metric */
.ops-list { width: 100%; max-height: 52vh; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; text-align: left; }
.ops-list h3 { font-family: var(--f-display); font-weight: 400; font-size: 16px; margin: 6px 0 0; color: var(--pink-deep); }
.ops-row { border: 2px solid var(--lilac); border-radius: 12px; padding: 6px 10px; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; font-size: 14px; }
.ops-row .v { font-family: var(--f-display); font-size: 16px; font-variant-numeric: tabular-nums; }
.ops-row small { grid-column: 1 / -1; color: var(--ink-soft); font-size: 12px; }

.petal {
  position: fixed; top: -20px; z-index: 30; width: 12px; height: 10px; pointer-events: none;
  border-radius: 70% 0 70% 0;
  animation: fall var(--d) linear forwards;
}
@keyframes fall { to { transform: translate(var(--dx), 110vh) rotate(720deg); } }

@media (max-height: 680px) {
  .app { gap: 8px; }
  .avatar { width: 46px; height: 46px; }
  .bubble { font-size: 14px; min-height: 46px; padding-block: 5px; }
  .act img { width: 52px; height: 52px; }
  .act.main img { width: 64px; height: 64px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
}
</style>

<div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>

<div class="app">
  <header class="top">
    <div class="stage-btn" id="stageBtn">
      <span id="stageLabel">STAGE 1</span><small id="sizeLabel">4×4</small>
    </div>
    <div class="progress" aria-live="polite">
      <div class="fill" id="progFill"></div>
      <div class="label"><img src="img/flower.png" alt=""><span id="progText">1 / 6</span></div>
    </div>
    <button class="exit-btn daily-btn" id="dailyBtn" type="button" data-str-aria="STR_UI_DAILY">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5.5" width="16" height="14.5" rx="2"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/><path class="star" d="M12 12.2l1.1 2.2 2.4.3-1.8 1.6.5 2.4-2.2-1.2-2.2 1.2.5-2.4-1.8-1.6 2.4-.3z"/></svg>
      <i class="dot" id="dailyDot" hidden></i>
    </button>
    <button class="exit-btn" id="exitBtn" type="button" data-str-aria="STR_UI_EXIT">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </header>

  <div class="talk">
    <div class="avatar"><img id="avatar" src="img/knight_normal.png" alt=""></div>
    <div class="bubble" id="bubble"><span id="bubbleText"></span></div>
  </div>

  <main class="stage-area" id="area">
    <div class="board-frame"><div class="board" id="board"></div></div>
  </main>

  <footer class="controls">

  const MOVES = [[1,2],[2,1],[2,-1],[1,-2],[-1,-2],[-2,-1],[-2,1],[-1,2]];

  const LINES = { R: [[1,0],[-1,0],[0,1],[0,-1]], B: [[1,1],[1,-1],[-1,1],[-1,-1]] };

  function rng(seed) {

      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;

  // Rook and bishop slide any distance and may stop on any open cell; only rocks (and the edge) block the line,
  // stepped cells can be passed over. `blocked(q)` says whether q is a rock.
  function pieceMoves(n, c, kind, blocked) {
    const x = c % n, y = (c / n) | 0, out = [];
    if (kind === "R" || kind === "B") {
      for (const [dx, dy] of LINES[kind]) {
        let nx = x + dx, ny = y + dy;
        while (nx >= 0 && ny >= 0 && nx < n && ny < n && !blocked(ny * n + nx)) { out.push(ny * n + nx); nx += dx; ny += dy; }
      }
      return out;
    }
    for (const [dx, dy] of kind === "K" ? KING : MOVES) {
      const nx = x + dx, ny = y + dy;
      if (nx >= 0 && ny >= 0 && nx < n && ny < n && !blocked(ny * n + nx)) out.push(ny * n + nx);

  }

  // Gimmick cells are placed on the route at roughly even steps: standing on one, the next move uses that piece.
  // A rook / bishop step only crosses cells already on the route, so the line stays open once rocks are placed.
  // spec = [board size, LEN, seed, type, pieces, count] (a StageTable row, or a daily puzzle's spec)
  function genLevel(spec) {
    const [n, len, seed, type, kinds = "", gcount = 0] = spec;
    const full = len === n * n;
    for (let attempt = 0; attempt < 2000; attempt++) {
      const r = rng(seed + attempt * 7);
      const vis = new Array(n * n).fill(false), gim = new Array(n * n).fill("");

  // Moves are one-way (a rook can reach a cell that cannot jump back), so in- and out-edges are checked separately.
  function searchLevel(L, path, limit, countUpTo = 0) {

        const stop = dfs(q, rem0 - 1);

      }
      return { next: first, count, nodes };

  // ---------- state ----------

  const firstOpen = () => { let i = 0; while (i < STAGES.length - 1 && cleared.has(i)) i++; return i; };
  let mainIndex = firstOpen();   // current main stage, kept while a daily puzzle is open
  const persist = () => { store.set({ cleared: [...cleared], stage: mainIndex, hints }); syncPlayer(); };

  // ---------- logs: Player + PlayLog (system doc table chapter, proposal 4.1) ----------
  // Player = this device's user state. PlayLog = one row per main-stage attempt; 다시하기 closes it as restart,
  // leaving (X, daily puzzle, closed app) as quit. An attempt still open at the next visit is closed as quit
  // at its last action. Rows live on this device (knight-tour-log); on claude.ai each finished row and the Player
  // are also written to the artifact store (players/<user id>, playlogs/<play_id>). Daily puzzles are not logged.
  const LKEY = "knight-tour-log", LOG_MAX = 3000;
  const iso = (ms = Date.now()) => new Date(ms).toISOString();
  const newId = p => p + (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
  const LOG = (() => { try { return JSON.parse(localStorage.getItem(LKEY)) || {}; } catch { return {}; } })();
  if (!LOG.player || !LOG.player.player_id) LOG.player = { player_id: newId("p_"), created_at: iso() };
  if (!Array.isArray(LOG.plays)) LOG.plays = [];
  let play = null;                                   // the open PlayLog row
  // export / upload copy: fields starting with _ are bookkeeping only
  const cleanRow = r => Object.fromEntries(Object.entries(r).filter(([k]) => k[0] !== "_"));
  function saveLog() {
    if (LOG.plays.length > LOG_MAX) LOG.plays.splice(0, LOG.plays.length - LOG_MAX);
    try { localStorage.setItem(LKEY, JSON.stringify(LOG)); } catch {}
  }
  function syncPlayer() {
    Object.assign(LOG.player, { lang: LANG, hint_count: hints, current_stage: mainIndex + 1,
      cleared_stages: [...cleared].sort((a, b) => a - b).map(i => i + 1) });
    saveLog();
  }
  function closeRow(r, result, at) {
    r.result = result; r.ended_at = iso(at); r.play_time_ms = Math.max(0, at - Date.parse(r.started_at));
    delete r._last;
  }
  function startPlay(i) {
    endPlay("quit");
    const stage_id = i + 1;
    play = { play_id: newId("pl_"), player_id: LOG.player.player_id, stage_id, seed: STAGES[i][2],
      attempt_no: LOG.plays.filter(r => r.stage_id === stage_id).length + 1,
      started_at: iso(), ended_at: null, result: null, play_time_ms: null,
      move_count: 0, undo_count: 0, hint_used: 0, stuck_count: 0, piece_stuck_count: 0, _last: Date.now() };
    LOG.plays.push(play);
    saveLog();
  }
  function endPlay(result) {
    if (!play) return;
    closeRow(play, result, Date.now());
    play = null;
    saveLog();
    flushLogs();
  }
  const logPlay = field => { if (!play) return; play[field]++; play._last = Date.now(); saveLog(); };
  // send finished rows the shared store has not received yet (claude.ai only)
  async function flushLogs() {
    if (!RANK.db || !RANK.uid) return;
    try {
      await RANK.db.doc("players/" + RANK.uid).set(cleanRow(LOG.player));
      for (const r of LOG.plays) if (r.result && !r._sent) {
        await RANK.db.doc("playlogs/" + r.play_id).set({ ...cleanRow(r), uid: RANK.uid });
        r._sent = 1;
      }
      saveLog();
    } catch {}
  }

  // ==METRICS==
  // Proposal 4.1: churn-first metrics from Player and PlayLog rows (tools/metrics.js runs the same code on exported logs).
  // stageType(stage_id) → "N" normal | "H" hurdle | "L" rest road. Rates count finished attempts only; null = no data.
  function computeMetrics(players, plays, stageType, now = Date.now()) {
    const DAY = 864e5, ts = s => Date.parse(s);
    const done = plays.filter(r => r.result);
    const rate = (rows, f) => rows.length ? { v: rows.filter(f).length / rows.length, n: rows.length } : null;
    const avg = (rows, f) => rows.length ? { v: rows.reduce((s, r) => s + f(r), 0) / rows.length, n: rows.length } : null;
    const span = (a, b) => done.filter(r => r.stage_id >= a && r.stage_id <= b);
    const quit = r => r.result === "quit";
    // churned = no visit for 7 days; D-n = came back at least n days after the first visit
    const early = rate(players, p => now - ts(p.last_login_at) >= 7 * DAY && p.current_stage <= 20);
    const dn = d => rate(players.filter(p => now - ts(p.created_at) >= d * DAY), p => ts(p.last_login_at) - ts(p.created_at) >= d * DAY);
    // pieces appear at 21 king, 41 rook, 61 bishop, 81 all; each band runs 20 stages
    const FIRST = [21, 41, 61, 81], BANDS = FIRST.map(a => [a, a + 19]);
    const first3 = FIRST.map(a => span(a, a + 2));
    const stuck = r => r.piece_stuck_count || 0;
    const type = k => done.filter(r => stageType(r.stage_id) === k);
    return {
      early, d1: dn(1), d7: dn(7),
      pieceQuit: rate(first3.flat(), quit),
      pieceQuitBands: first3.map(rows => rate(rows, quit)),
      pieceQuitPrev: rate(FIRST.flatMap(a => span(a - 3, a - 1)), quit),
      pieceStuck: avg(span(21, 100), stuck),
      pieceStuckFront: avg(BANDS.flatMap(([a]) => span(a, a + 9)), stuck),
      pieceStuckBack: avg(BANDS.flatMap(([, b]) => span(b - 9, b)), stuck),
      hurdleQuit: rate(type("H"), quit),
      hurdlePrevQuit: rate(done.filter(r => stageType(r.stage_id + 1) === "H"), quit),
      hurdleHint: rate(type("H"), r => r.hint_used > 0),
      normalHint: rate(type("N"), r => r.hint_used > 0),
      restClear: rate(type("L"), r => r.result === "clear"),
      normalClear: rate(type("N"), r => r.result === "clear"),
    };
  }
  // ==/METRICS==

  // Daily puzzles: three per local date, generated from the date (same puzzles for everyone that day),
  // each with exactly one answer route. Daily hints are a separate pool of 5 that resets every day.
  const DAILY = [
    { id: "easy", size: 5, len: 14, key: "STR_UI_DAILY_EASY" },
    { id: "normal", size: 6, len: 21, key: "STR_UI_DAILY_NORMAL" },
    { id: "hard", size: 7, len: 30, key: "STR_UI_DAILY_HARD" },
  ];
  const DAILY_HINTS = 5, DKEY = "knight-tour-daily";
  const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
  function loadDailyState() {
    let d = null;
    try { d = JSON.parse(localStorage.getItem(DKEY)); } catch {}
    if (!d || d.date !== today()) d = { date: today(), hints: DAILY_HINTS, runs: {} };   // a new day resets hints and runs
    return d;
  }
  let daily = loadDailyState();
  const saveDaily = () => { try { localStorage.setItem(DKEY, JSON.stringify(daily)); } catch {} };
  const run = id => (daily.runs[id] ||= { start: null, hints: 0, done: false, time: 0 });
  const fmtTime = ms => { const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = s % 60;
    return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0"); };

  let L = null, S = null, cellPx = 40;
  let mode = "main";                      // "main" | "daily"
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const $ = id => document.getElementById(id);
  const board = $("board"), area = $("area");
  let cts = [], trail = null, knight = null;

  const cur = () => S.path[S.path.length - 1];
  // the goal castle can only be entered as the very last step
  const options = () => L.nb[cur()].filter(q => !S.vis[q] && (q !== L.goal || L.len - S.path.length === 1));

  // ---------- wrong-path memo ----------
  // Like a sudoku pencil mark: a move the player has seen end in a dead end is painted red.
  // A board state is "where the knight stands + which cells are already stepped on" (the order does not matter),
  // so S.wrong maps that state to its proven dead moves. Marks survive undo: coming back to the same state shows them
  // again. Only 다시하기 (restart) or a new stage clears them.
  const stateKey = k => S.path[k - 1] + "|" + S.path.slice(0, k).sort((a, b) => a - b).join(",");
  const wrongHere = () => S.wrong[stateKey(S.path.length)] || new Set();
  const isWrong = c => wrongHere().has(c);
  function markWrong(k, c) {
    (S.wrong[stateKey(k)] ||= new Set()).add(c);
    // spread backwards: if every move from a state is red, the move into that state is red too
    while (k > 1 && S.path.length >= k) {
      const at = S.path[k - 1], prefix = new Set(S.path.slice(0, k)), dead = S.wrong[stateKey(k)];
      const opts = L.nb[at].filter(q => !prefix.has(q) && (q !== L.goal || L.len - k === 1));
      if (!opts.length || !opts.every(q => dead.has(q))) break;
      (S.wrong[stateKey(k - 1)] ||= new Set()).add(at);
      k--;
    }
  }

  function loadStage(i, replay) {
    mode = "main"; mainIndex = i;
    startPlay(i);
    document.querySelector(".app").classList.remove("daily");
    L = genLevel(STAGES[i]);
    L.index = i;
    L.nb = neighbors(L);
    S = { path: [L.start], vis: new Uint8Array(L.n * L.n), hintsUsed: 0, undos: 0, busy: false, done: false, hintCell: -1, reward: 0, wrong: {} };
    S.vis[L.start] = 1;
    if (Array.isArray(replay) && replay[0] === L.start) {
      for (const c of replay.slice(1)) {
        if (!L.nb[cur()].includes(c) || S.vis[c]) break;
        S.path.push(c); S.vis[c] = 1;
      }
    }
    buildBoard();
    layout();
    render();
    setMood("normal");
    $("stageLabel").textContent = t("STR_UI_STAGE", { stage: i + 1 });
    $("sizeLabel").textContent = `${L.n}×${L.n}`;
    const INTRO = { 20: "STR_DLG_INTRO_K", 40: "STR_DLG_INTRO_R", 60: "STR_DLG_INTRO_B", 80: "STR_DLG_INTRO_ALL" };
    say(i === 0 ? "STR_DLG_STAGE_START_FIRST" : INTRO[i] ? INTRO[i] :
        L.type === "H" ? "STR_DLG_STAGE_START_HURDLE" :
        L.type === "L" ? "STR_DLG_STAGE_START_LONG" : "STR_DLG_STAGE_START", { count: L.len });
    persist();
    if (S.path.length > 1) afterMove(false);
  }

  // The day's puzzle for one difficulty: candidate seeds from (date, difficulty, k) until the map has a single answer.
  const strHash = s => { let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
  const dailyCache = {};
  function dailyLevel(date, def) {
    const key = date + "|" + def.id;
    if (dailyCache[key]) return dailyCache[key];
    const keep = L;
    let cand = null;
    for (let k = 0; k < 400; k++) {
      cand = genLevel([def.size, def.len, strHash(`${date}|${def.id}|${k}`), "N"]);
      cand.nb = neighbors(cand);
      L = cand;
      const r = search([cand.start], 300000, 2);
      if (r.count === 1 && r.next >= 0) break;
    }
    L = keep;
    return (dailyCache[key] = cand);
  }

  let clock = 0;
  function loadDaily(id) {
    if (daily.date !== today()) daily = loadDailyState();
    const def = DAILY.find(d => d.id === id);
    endPlay("quit");
    mode = "daily";
    document.querySelector(".app").classList.add("daily");
    L = dailyLevel(daily.date, def);
    L.daily = def;
    S = { path: [L.start], vis: new Uint8Array(L.n * L.n), hintsUsed: run(id).hints, undos: 0, busy: false, done: false, hintCell: -1, reward: 0, wrong: {} };
    S.vis[L.start] = 1;
    buildBoard();
    layout();
    render();
    setMood("normal");
    $("stageLabel").textContent = t("STR_UI_DAILY_LABEL", { name: t(def.key) });
    say("STR_DLG_DAILY_START", { count: L.len });
    clearInterval(clock);
    clock = setInterval(() => { if (mode === "daily" && !S.done) render(); }, 1000);
  }
  // the daily clock starts on the first move or hint and keeps running across restarts and reloads
  function startClock() {
    if (mode !== "daily") return;
    const r = run(L.daily.id);
    if (!r.start && !r.done) { r.start = Date.now(); saveDaily(); }
  }
  const elapsed = () => { const r = run(L.daily.id); return r.done ? r.time : r.start ? Date.now() - r.start : 0; };

  function buildBoard() {
    const { n } = L;
    board.innerHTML = "";
    board.style.setProperty("--n", n);
    const frag = document.createDocumentFragment();
    for (let c = 0; c < n * n; c++) {
      const g = document.createElement("div");
      g.className = "g " + (((c % n) + ((c / n) | 0)) % 2 ? "b" : "a") +
        (c === 0 ? " tl" : c === n - 1 ? " tr" : c === n * (n - 1) ? " bl" : c === n * n - 1 ? " br" : "");
      g.style.setProperty("--x", c % n); g.style.setProperty("--y", (c / n) | 0);
      frag.appendChild(g);
    }
    trail = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    trail.setAttribute("class", "trail");
    trail.setAttribute("viewBox", `0 0 ${n} ${n}`);
    trail.setAttribute("preserveAspectRatio", "none");
    trail.innerHTML = "<polyline/>";
    frag.appendChild(trail);
    cts = [];
    for (let c = 0; c < n * n; c++) {
      const ct = document.createElement("div");
      ct.className = "ct";
      ct.style.setProperty("--x", c % n); ct.style.setProperty("--y", (c / n) | 0);
      if (L.rock[c]) ct.innerHTML = ROCK_ART;
      else ct.innerHTML = idleArt(c);
      cts.push(ct);
      frag.appendChild(ct);
    }
    knight = document.createElement("div");
    knight.id = "knight";
    knight.dataset.mood = "normal";
    knight.innerHTML = `<div class="kflip"><div class="kbob"><div class="ksq"><div class="kshadow"></div>${KNIGHT_ART}</div></div></div>`;
    frag.appendChild(knight);
    board.appendChild(frag);
  }

  function layout() {
    if (!L) return;
    const r = area.getBoundingClientRect();
    const size = Math.max(120, Math.min(r.width, r.height) - 14);
    cellPx = Math.floor(size / L.n);
    board.style.setProperty("--c", cellPx + "px");
    board.style.width = board.style.height = cellPx * L.n + "px";
    const kw = cellPx * 1.3, kh = cellPx * 1.55;
    knight.style.width = kw + "px";
    knight.style.height = kh + "px";
    const p = kpos(cur());
    knight.style.transform = `translate(${p.x}px, ${p.y}px)`;
  }

  function kpos(c) {
    const kw = cellPx * 1.3, kh = cellPx * 1.55;
    return { x: (c % L.n) * cellPx + (cellPx - kw) / 2, y: ((c / L.n) | 0) * cellPx + cellPx * 0.97 - kh };
  }

  function render() {
    const opts = S.done ? [] : options();
    S.path.forEach((c, k) => {
      const ct = cts[c];
      if (ct.dataset.v !== String(k + 1)) { ct.dataset.v = k + 1; ct.innerHTML = flowerArt(k + 1) + (L.gim && L.gim[c] ? pieceArt(L.gim[c], true) : ""); }
    });
    cts.forEach((ct, c) => {
      if (!S.vis[c] && ct.dataset.v) { delete ct.dataset.v; ct.innerHTML = idleArt(c); }
      ct.classList.toggle("mark", !S.busy && opts.includes(c) && !isWrong(c));
      ct.classList.toggle("wrong", !S.busy && opts.includes(c) && isWrong(c));
      ct.classList.toggle("hint", !S.busy && c === S.hintCell);
    });
    trail.firstChild.setAttribute("points", S.path.map(c => `${c % L.n + .5},${((c / L.n) | 0) + .5}`).join(" "));
    $("progText").textContent = `${S.path.length} / ${L.len}`;
    if (mode === "daily") $("sizeLabel").textContent = fmtTime(elapsed());   // the daily clock sits where the board size is shown
    $("progFill").style.width = (S.path.length / L.len * 100) + "%";
    if (mode === "daily") {                // daily puzzles use the day's own hint pool, no ads
      $("hintCount").textContent = daily.hints;
      $("hintBtn").classList.remove("ad");
    } else {
      // with no hints left the button stays active and opens the rewarded-ad offer
      $("hintCount").textContent = hints > 0 ? hints : t("STR_UI_AD_BADGE");
      $("hintBtn").classList.toggle("ad", hints <= 0);
    }
    $("dailyDot").hidden = DAILY.every(d => run(d.id).done);
    $("undoBtn").setAttribute("aria-disabled", S.path.length <= 1);
  }

  function setMood(m) {
    if (knight) knight.dataset.mood = m;
    const a = $("avatar"), src = IMG("knight_" + m);
    if (a && a.getAttribute("src") !== src) a.src = src;
  }
  // short haptic ticks on phones that support it (silently ignored elsewhere)
  const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch {} };

  let bubbleTimer = 0;
  // the bubble takes a StringTable key; the last key + params are kept so a language change can re-render it
  let lastSay = null;
  function say(key, params) {
    const b = $("bubble");
    lastSay = { key, params };
    $("bubbleText").textContent = t(key, params);
    b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop");
    clearTimeout(bubbleTimer);
  }

  function hop(from, to, done) {
    const a = kpos(from), b = kpos(to);
    if (b.x !== a.x) knight.querySelector(".kflip").style.setProperty("--face", b.x < a.x ? -1 : 1);
    knight.style.transform = `translate(${b.x}px, ${b.y}px)`;
    if (reduced) { done(); return; }
    const h = cellPx * 0.8, frames = [];
    for (let k = 0; k <= 10; k++) {
      const t = k / 10;
      frames.push({ transform: `translate(${a.x + (b.x - a.x) * t}px, ${a.y + (b.y - a.y) * t - 4 * h * t * (1 - t)}px)` });
    }
    knight.animate(frames, { duration: 320, easing: "linear" });
    // game logic runs on a timer so input never depends on the animation finishing
    setTimeout(() => {
      knight.querySelector(".ksq").animate(
        [{ transform: "scale(1.18, .82)" }, { transform: "scale(.95, 1.05)" }, { transform: "scale(1)" }],
        { duration: 220, easing: "ease-out" });
      done();
    }, 320);
  }

  // ---------- actions ----------
  function tap(c) {
    if (S.busy || S.done) return;
    if (c === cur()) return;
    if (options().includes(c) && isWrong(c)) {
      const ct = cts[c];
      ct.classList.remove("shake"); void ct.offsetWidth; ct.classList.add("shake");
      buzz(15); say("STR_DLG_WRONG_TAP"); return;
    }
    if (options().includes(c)) return move(c);
    const ct = cts[c];
    ct.classList.remove("shake"); void ct.offsetWidth; ct.classList.add("shake");
    buzz(15);
    say(L.rock[c] ? "STR_DLG_TAP_ROCK" : S.vis[c] ? "STR_DLG_TAP_FLOWER" :
        c === L.goal ? "STR_DLG_TAP_CASTLE_EARLY" :
        L.gim && L.gim[cur()] ? "STR_DLG_GIM_" + L.gim[cur()] : "STR_DLG_TAP_INVALID");
  }

  function move(c) {
    const from = cur();
    startClock();
    S.path.push(c); S.vis[c] = 1; S.hintCell = -1; S.busy = true;
    logPlay("move_count");
    setMood("jump");
    $("undoBtn").classList.remove("nudge");
    render();
    hop(from, c, () => { S.busy = false; afterMove(true); });
  }

  function afterMove(fromPlay) {
    render();
    const left = L.len - S.path.length;
    if (left === 0) {
      if (mode === "daily") {
        const r = run(L.daily.id);
        S.firstClear = !r.done;
        if (!r.done) {                        // only the first clear of the day is a ranked record
          r.done = true; r.time = r.start ? Date.now() - r.start : 0; saveDaily();
          submitRank(L.daily.id, r.hints, r.time);
        }
        S.done = true; setMood("happy"); render(); buzz([30, 50, 30, 50, 60]);
        say("STR_DLG_CLEAR");
        setTimeout(showClear, reduced ? 0 : 550);
        return;
      }
      if (!cleared.has(L.index)) { S.reward = HINT_CLEAR_REWARD; hints += S.reward; }
      S.done = true; setMood("happy"); render(); buzz([30, 50, 30, 50, 60]);
      say("STR_DLG_CLEAR");
      cleared.add(L.index); persist();
      endPlay("clear");
      setTimeout(showClear, reduced ? 0 : 550);
      return;
    }
    if (!options().length || options().every(isWrong)) {
      if (fromPlay) {
        logPlay("stuck_count");
        if (L.gim && L.gim[S.path[S.path.length - 2]]) logPlay("piece_stuck_count");   // the last move used a piece
      }
      setMood("sad"); buzz([20, 40, 20]);
      say(options().length ? "STR_DLG_ALL_WRONG" : "STR_DLG_STUCK", { count: left });
      $("undoBtn").classList.add("nudge");
      return;
    }
    setMood("normal");
    const piece = L.gim && L.gim[cur()];
    if (piece) say("STR_DLG_GIM_" + piece);      // the next move uses this cell's piece
    else if (fromPlay) say(left <= 3 ? "STR_DLG_MOVE_NEAR_END" : "STR_DLG_MOVE", { count: left });
  }

  function undo() {
    if (S.busy || S.done || S.path.length <= 1) return;
    const deadEnd = !options().length || options().every(isWrong);   // checked before stepping back
    const from = S.path.pop();
    S.vis[from] = 0; S.undos++; S.hintCell = -1; S.busy = true;
    logPlay("undo_count");
    if (deadEnd) markWrong(S.path.length, from);
    $("undoBtn").classList.remove("nudge");
    setMood("jump");
    render();
    hop(from, cur(), () => {
      S.busy = false; render();
      if (options().length && options().every(isWrong)) {      // every way on from here is already red
        setMood("sad"); say("STR_DLG_ALL_WRONG"); $("undoBtn").classList.add("nudge"); return;
      }
      setMood("normal"); say("STR_DLG_UNDO", { count: L.len - S.path.length });
    });
  }

  function restart() {
    if (S.busy) return;
    if (mode === "daily") loadDaily(L.daily.id); else { endPlay("restart"); loadStage(L.index); }
  }

  const search = (path, limit, countUpTo = 0) => searchLevel(L, path, limit, countUpTo);

  // Find the latest point on the player's path from which a full route still exists.
  // Returns { k, next }: keep the first k cells of the path, then step to `next`.
  // The generator's own route always works, so the shared prefix with it is the fallback.
  function findRewind() {
    const p = S.path;
    let common = 0;
    while (common < p.length && p[common] === L.solution[common]) common++;
    let budget = 400000;
    for (let k = p.length; k > common && budget > 0; k--) {
      const r = search(p.slice(0, k), Math.min(120000, budget));
      budget -= r.nodes;
      if (r.next >= 0) return { k, next: r.next };
    }
    return { k: common, next: L.solution[common] };
  }

  function hint() {
    if (S.busy || S.done) return;
    if (mode === "daily") {
      if (daily.hints <= 0) { say("STR_DLG_DAILY_HINT_EMPTY"); return; }
      startClock();
      daily.hints--; run(L.daily.id).hints++; saveDaily();
    } else {
      if (hints <= 0) { openAd(); return; }
      hints--; persist();
    }
    const { k, next } = findRewind();
    S.hintsUsed++;
    logPlay("hint_used");
    $("undoBtn").classList.remove("nudge");
    const back = S.path.length - k;
    if (back === 0) {
      S.hintCell = next;
      render();
      say("STR_DLG_HINT");
      return;
    }
    // rewind to the last solvable point, then show the way from there
    const from = cur();
    for (const c of S.path.splice(k)) S.vis[c] = 0;
    S.busy = true;
    setMood("jump");
    render();
    hop(from, cur(), () => {
      S.busy = false;
      S.hintCell = next;
      setMood("normal");
      render();
      say("STR_DLG_HINT_REWIND", { count: back });
    });
  }

  // ---------- overlays ----------
  function showClear() {
    $("clearRank").hidden = true;
    $("clearRankBtn").hidden = mode !== "daily";
    if (mode === "daily") {
      const r = run(L.daily.id), name = t(L.daily.key);
      $("clearTitle").textContent = t("STR_UI_DAILY_CLEAR_TITLE", { name });
      $("clearSub").textContent = S.firstClear ? t("STR_UI_DAILY_CLEAR_DESC", { hints: r.hints, time: fmtTime(r.time) }) : t("STR_UI_DAILY_PRACTICE");
      $("statUndo").textContent = t("STR_UI_STAT_UNDO", { count: S.undos });
      $("statHint").textContent = t("STR_UI_STAT_HINT", { count: S.hintsUsed });
      $("clearReward").hidden = true;
      $("nextBtn").textContent = t("STR_UI_DAILY_LIST");
      $("clearOverlay").hidden = false;
      $("nextBtn").focus();
      showMyRank();
      petals();
      return;
    }
    const last = L.index === STAGES.length - 1;
    $("clearTitle").textContent = last ? t("STR_UI_CLEAR_TITLE_LAST") : t("STR_UI_CLEAR_TITLE", { stage: L.index + 1 });
    $("clearSub").textContent = t(last ? "STR_UI_CLEAR_DESC_LAST" : "STR_UI_CLEAR_DESC", { count: L.len });
    $("statUndo").textContent = t("STR_UI_STAT_UNDO", { count: S.undos });
    $("statHint").textContent = t("STR_UI_STAT_HINT", { count: S.hintsUsed });
    $("clearReward").hidden = !S.reward;
    $("clearReward").textContent = t("STR_UI_CLEAR_REWARD", { count: S.reward });
    $("nextBtn").textContent = t(last ? "STR_UI_RESTART_ALL" : "STR_UI_NEXT");
    $("clearOverlay").hidden = false;
    $("nextBtn").focus();
    petals();
  }

  function petals() {
    if (reduced) return;
    const colors = ["#FF7FA8", "#FFD45C", "#FFFFFF", "#AEE283", "#FF9FBE"];
    for (let k = 0; k < 46; k++) {
      const p = document.createElement("div");
      p.className = "petal";
      p.style.left = Math.random() * 100 + "vw";
      p.style.background = colors[k % colors.length];
      p.style.setProperty("--d", (1.8 + Math.random() * 1.6) + "s");
      p.style.setProperty("--dx", (Math.random() * 160 - 80) + "px");
      p.style.animationDelay = Math.random() * .6 + "s";
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 4200);
    }
  }

  // Rewarded ad: the prototype has no ad SDK, so a 3-second placeholder stands in for the ad.
  const AD_SECONDS = 3;
  let adTimer = 0;
  function openAd() {
    $("adOverlay").hidden = false;
    $("adWatchBtn").focus();
  }
  function closeAd() {
    $("adOverlay").hidden = true;
    say("STR_DLG_HINT_EMPTY");
  }
  function playAd() {
    $("adOverlay").hidden = true;
    $("adPlaying").hidden = false;
    let left = AD_SECONDS;
    $("adCount").textContent = left;
    clearInterval(adTimer);
    adTimer = setInterval(() => {
      if (--left > 0) { $("adCount").textContent = left; return; }
      clearInterval(adTimer);
      $("adPlaying").hidden = true;
      hints += HINT_AD_REWARD; persist();
      render();
      buzz(30);
      say("STR_DLG_HINT_AD_REWARD");
    }, 1000);
  }

  // ---------- daily list ----------
  function openDaily() {
    if (daily.date !== today()) { daily = loadDailyState(); }
    $("dailyDate").textContent = daily.date;
    $("dailyHints").textContent = t("STR_UI_DAILY_HINTS", { count: daily.hints, max: DAILY_HINTS });
    const list = $("dailyList");
    list.innerHTML = "";
    for (const d of DAILY) {
      const r = run(d.id);
      const row = document.createElement("div");
      row.className = "daily-row" + (r.done ? " done" : "");
      const info = document.createElement("div");
      const b = document.createElement("b"); b.textContent = `${t(d.key)}  ${d.size}×${d.size}`;
      const sm = document.createElement("small");
      sm.textContent = r.done ? t("STR_UI_DAILY_DONE", { hints: r.hints, time: fmtTime(r.time) })
        : r.start ? t("STR_UI_DAILY_PLAYING", { time: fmtTime(Date.now() - r.start) }) : t("STR_UI_DAILY_NEW");
      info.append(b, sm);
      const play = document.createElement("button");
      play.type = "button"; play.className = "btn pink";
      play.textContent = t(r.done ? "STR_UI_DAILY_REPLAY" : r.start ? "STR_UI_DAILY_CONTINUE" : "STR_UI_DAILY_PLAY");
      play.addEventListener("click", () => { $("dailyOverlay").hidden = true; loadDaily(d.id); });
      const rk = document.createElement("button");
      rk.type = "button"; rk.className = "btn"; rk.textContent = t("STR_UI_RANK");
      rk.addEventListener("click", () => { $("dailyOverlay").hidden = true; openRank(d.id); });
      row.append(info, play, rk);
      list.appendChild(row);
    }
    $("dailyMainBtn").hidden = mode !== "daily";
    $("dailyOverlay").hidden = false;
  }

  // ---------- ranking ----------
  // Shared store (claude.ai artifact db): one document per player, ranks/<player id>,
  // holding { r: { "<date>|<difficulty>": [hints, timeMs, clearedAt] } } for the last two weeks.
  // Everyone reads all documents; each player writes only their own. Without the store, only this device's record is shown.
  const RANK = { db: null, user: null, uid: null, docs: [], live: false, saveFailed: false };
  let rankTab = "easy";
  (async () => {
    try {
      if (!window.claude?.use) return;
      const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
      if (!db) return;
      RANK.db = db; RANK.user = user;
      RANK.uid = user ? await user.id() : null;
      flushLogs();
      db.collection("ranks").limit(1000).onSnapshot(snap => {
        RANK.docs = snap.docs; RANK.live = true;
        if (!$("rankOverlay").hidden) renderRank();
        if (!$("clearOverlay").hidden && mode === "daily") showMyRank();
      }, () => { RANK.live = false; });
    } catch {}
  })();

  function rankRows(id) {
    const key = daily.date + "|" + id, rows = [];
    for (const d of RANK.docs) {
      const v = d.data()?.r?.[key];
      if (Array.isArray(v) && v.length >= 2 && Number.isFinite(v[0]) && Number.isFinite(v[1])) rows.push({ id: d.id, h: v[0], t: v[1], at: v[2] || 0 });
    }
    // local record when this view has no shared store (or it has not posted yet)
    const mine = run(id);
    if (mine.done && !rows.some(x => x.id === RANK.uid)) rows.push({ id: RANK.uid || "local", h: mine.hints, t: mine.time, at: 0, local: true });
    rows.sort((a, b) => a.h - b.h || a.t - b.t || a.at - b.at);   // fewest hints, then fastest, then earliest
    return rows;
  }

  async function submitRank(id, h, time) {
    if (!RANK.db || !RANK.uid) return;
    try {
      const ref = RANK.db.doc("ranks/" + RANK.uid);
      const snap = await ref.get();
      const r = { ...(snap.exists ? snap.data().r || {} : {}) };
      const cutoff = Date.now() - 14 * 864e5;
      for (const k of Object.keys(r)) if (!Array.isArray(r[k]) || (r[k][2] || 0) < cutoff) delete r[k];
      r[daily.date + "|" + id] = [h, time, Date.now()];
      await ref.set({ r });
    } catch { RANK.saveFailed = true; }
  }

  function showMyRank() {
    const rows = rankRows(L.daily.id);
    const me = rows.findIndex(x => x.id === (RANK.uid || "local"));
    if (me < 0) return;
    $("clearRank").textContent = t("STR_UI_RANK_MINE", { rank: me + 1, total: rows.length });
    $("clearRank").hidden = false;
  }

  function openRank(id) {
    rankTab = id || rankTab;
    const tabs = $("rankTabs");
    tabs.innerHTML = "";
    for (const d of DAILY) {
      const b = document.createElement("button");
      b.type = "button"; b.setAttribute("role", "tab"); b.textContent = t(d.key);
      b.setAttribute("aria-selected", d.id === rankTab);
      b.addEventListener("click", () => openRank(d.id));
      tabs.appendChild(b);
    }
    $("rankOverlay").hidden = false;
    renderRank();
  }

  async function renderRank() {
    const rows = rankRows(rankTab), list = $("rankList");
    const ids = rows.map(x => x.id).filter(x => x && x !== "local");
    const ps = RANK.user && ids.length ? await RANK.user.profiles(ids) : {};
    list.innerHTML = "";
    if (!rows.length) {
      const li = document.createElement("li"); li.className = "empty"; li.textContent = t("STR_UI_RANK_EMPTY"); list.appendChild(li);
    }
    rows.forEach((x, i) => {
      const li = document.createElement("li");
      const isMe = x.id === (RANK.uid || "local");
      if (isMe) li.className = "me";
      const no = document.createElement("span"); no.className = "no"; no.textContent = i + 1;
      const img = document.createElement("img"); img.alt = "";
      const p = ps[x.id];
      if (p?.avatarUrl) img.src = p.avatarUrl; else img.src = IMG("knight_normal");
      const nm = document.createElement("span"); nm.className = "nm";
      nm.textContent = isMe ? (p && p.name ? `${p.name} (${t("STR_UI_RANK_ME")})` : t("STR_UI_RANK_ME")) : (p && p.name) || t("STR_UI_RANK_SOMEONE");
      const sc = document.createElement("span"); sc.className = "sc"; sc.textContent = t("STR_UI_RANK_ROW", { hints: x.h, time: fmtTime(x.t) });
      li.append(no, img, nm, sc);
      list.appendChild(li);
    });
    $("rankNote").textContent = RANK.saveFailed ? t("STR_UI_RANK_SAVE_FAIL") : RANK.live ? t("STR_UI_RANK_LIVE") : t("STR_UI_RANK_OFFLINE");
  }

  // ---------- wiring ----------
  // pointerdown reacts the moment a finger touches the board (no click delay on phones)
  // ---------- collected metrics view (#metrics) ----------
  function openOps() {
    const m = computeMetrics([LOG.player], LOG.plays, id => STAGES[id - 1] && STAGES[id - 1][3]);
    const pct = x => x ? Math.round(x.v * 100) + "%" : "–";
    const num = x => x ? x.v.toFixed(2) : "–";
    const groups = [
      ["STR_OPS_G_CASUAL", [
        ["STR_OPS_EARLY", pct(m.early), t("STR_OPS_SUB_EARLY", { n: m.early ? m.early.n : 0 })],
        ["STR_OPS_D1D7", `${pct(m.d1)} / ${pct(m.d7)}`, t("STR_OPS_SUB_D1D7", { n1: m.d1 ? m.d1.n : 0, n7: m.d7 ? m.d7.n : 0 })]]],
      ["STR_OPS_G_PIECE", [
        ["STR_OPS_PIECE_QUIT", pct(m.pieceQuit), t("STR_OPS_SUB_PIECE_QUIT", { k: pct(m.pieceQuitBands[0]), r: pct(m.pieceQuitBands[1]),
          b: pct(m.pieceQuitBands[2]), a: pct(m.pieceQuitBands[3]), prev: pct(m.pieceQuitPrev) })],
        ["STR_OPS_PIECE_STUCK", num(m.pieceStuck), t("STR_OPS_SUB_PIECE_STUCK", { a: num(m.pieceStuckFront), b: num(m.pieceStuckBack) })]]],
      ["STR_OPS_G_HURDLE", [
        ["STR_OPS_HURDLE_QUIT", pct(m.hurdleQuit), t("STR_OPS_SUB_VS_PREV", { b: pct(m.hurdlePrevQuit) })],
        ["STR_OPS_HURDLE_HINT", pct(m.hurdleHint), t("STR_OPS_SUB_VS_NORMAL", { b: pct(m.normalHint) })],
        ["STR_OPS_REST_CLEAR", pct(m.restClear), t("STR_OPS_SUB_VS_NORMAL", { b: pct(m.normalClear) })]]],
    ];
    const list = $("opsList");
    list.innerHTML = "";
    for (const [g, rows] of groups) {
      const h = document.createElement("h3");
      h.textContent = t(g);
      list.appendChild(h);
      for (const [k, v, sub] of rows) {
        const row = document.createElement("div");
        row.className = "ops-row";
        for (const [tag, text, cls] of [["span", t(k)], ["span", v, "v"], ["small", sub]]) {
          const el = document.createElement(tag);
          el.textContent = text;
          if (cls) el.className = cls;
          row.appendChild(el);
        }
        list.appendChild(row);
      }
    }
    $("opsNote").textContent = t("STR_OPS_NOTE", { players: 1, plays: LOG.plays.filter(r => r.result).length });
    $("opsOverlay").hidden = false;
  }
  function exportLogs() {
    const data = { exported_at: iso(), players: [cleanRow(LOG.player)], plays: LOG.plays.map(cleanRow) };
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], { type: "application/json" }));
    a.download = `knight-tour-log-${today()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  $("opsExport").addEventListener("click", exportLogs);
  $("closeOps").addEventListener("click", () => { $("opsOverlay").hidden = true; });
  $("opsOverlay").addEventListener("click", e => { if (e.target === e.currentTarget) e.currentTarget.hidden = true; });
  addEventListener("hashchange", () => { if (location.hash === "#metrics") openOps(); });

  board.addEventListener("pointerdown", e => {
    if (!L || !e.isPrimary || (e.pointerType === "mouse" && e.button !== 0)) return;
    e.preventDefault();
    const r = board.getBoundingClientRect();
    const x = Math.floor((e.clientX - r.left) / cellPx), y = Math.floor((e.clientY - r.top) / cellPx);
    if (x >= 0 && y >= 0 && x < L.n && y < L.n) tap(y * L.n + x);
  });
  $("undoBtn").addEventListener("click", undo);
  $("hintBtn").addEventListener("click", hint);
  $("restartBtn").addEventListener("click", restart);
  // exit: save, then try to close; pages the script didn't open can't close themselves, so fall back to a stopped screen
  $("exitBtn").addEventListener("click", () => { $("exitOverlay").hidden = false; $("exitCancelBtn").focus(); });
  $("exitCancelBtn").addEventListener("click", () => { $("exitOverlay").hidden = true; });
  $("exitOverlay").addEventListener("click", e => { if (e.target === e.currentTarget) e.currentTarget.hidden = true; });
  $("exitConfirmBtn").addEventListener("click", () => {
    persist();
    if (mode === "main" && !S.done) endPlay("quit");
    $("exitOverlay").hidden = true;
    try { window.close(); } catch {}
    setTimeout(() => { $("endedOverlay").hidden = false; $("resumeBtn").focus(); }, 150);
  });
  $("resumeBtn").addEventListener("click", () => {
    $("endedOverlay").hidden = true;
    if (mode === "main" && !S.done) startPlay(L.index);   // a resumed stage is a new attempt
  });
  $("adWatchBtn").addEventListener("click", playAd);
  $("adCloseBtn").addEventListener("click", closeAd);
  $("adOverlay").addEventListener("click", e => { if (e.target === e.currentTarget) closeAd(); });
  $("nextBtn").addEventListener("click", () => {
    $("clearOverlay").hidden = true;
    if (mode === "daily") { openDaily(); return; }
    loadStage(L.index === STAGES.length - 1 ? 0 : L.index + 1);   // stages run in order; after the last one the journey starts over
  });
  $("clearRankBtn").addEventListener("click", () => { $("clearOverlay").hidden = true; openRank(L.daily.id); });
  $("dailyBtn").addEventListener("click", openDaily);
  $("closeDaily").addEventListener("click", () => { $("dailyOverlay").hidden = true; });
  $("dailyMainBtn").addEventListener("click", () => { $("dailyOverlay").hidden = true; clearInterval(clock); loadStage(mainIndex); });
  $("dailyOverlay").addEventListener("click", e => { if (e.target === e.currentTarget) e.currentTarget.hidden = true; });
  $("closeRank").addEventListener("click", () => { $("rankOverlay").hidden = true; });
  $("rankOverlay").addEventListener("click", e => { if (e.target === e.currentTarget) e.currentTarget.hidden = true; });
  document.addEventListener("keydown", e => {
    if (!$("adPlaying").hidden || !$("endedOverlay").hidden) return;
    if (!$("exitOverlay").hidden) { if (e.key === "Escape") $("exitOverlay").hidden = true; return; }
    if (!$("adOverlay").hidden) { if (e.key === "Escape") closeAd(); return; }
    if (!$("clearOverlay").hidden || !$("dailyOverlay").hidden || !$("rankOverlay").hidden || !$("opsOverlay").hidden) {
      if (e.key === "Escape") { $("dailyOverlay").hidden = true; $("rankOverlay").hidden = true; $("opsOverlay").hidden = true; }
      return;
    }
    const k = e.key.toLowerCase();
    if (k === "z" || k === "backspace") undo();
    else if (k === "h") hint();
    else if (k === "r") restart();
  });
  $("clearArt").innerHTML = `<img src="${IMG("knight_happy")}" alt="" draggable="false">`;
  // language switch (no button yet): refresh static markup, bubble, HUD and open sheets
  function setLang(lang) {
    LANG = lang;
    applyStaticText();
    if (lastSay) say(lastSay.key, lastSay.params);
    if (L) $("stageLabel").textContent = mode === "daily" ? t("STR_UI_DAILY_LABEL", { name: t(L.daily.key) }) : t("STR_UI_STAGE", { stage: L.index + 1 });
    if (!$("dailyOverlay").hidden) openDaily();
    if (!$("rankOverlay").hidden) openRank();
    if (!$("opsOverlay").hidden) openOps();
  }
  if (location.hash === "#debug") window.__kt = { tap: c => tap(c), undo: () => undo(), wrong: () => S.wrong, log: LOG, openOps, setLang, search, findRewind, loadStage, loadDaily, dailyLevel, daily: () => daily, rank: RANK, state: () => S, level: () => L, stages: STAGES };
  new ResizeObserver(layout).observe(area);

  function boot(d) {
    applyStaticText();
    // this visit: close attempts a closed app left open, then stamp the login
    for (const r of LOG.plays) if (!r.result) closeRow(r, "quit", r._last || Date.parse(r.started_at));
    LOG.player.last_login_at = iso();
    // a live reload may keep the stage in progress, but never jump past the first stage not cleared
    let st = d && Number.isInteger(d.stage) ? d.stage : mainIndex;
    if (st < 0 || st > firstOpen()) st = firstOpen();
    loadStage(st, d && d.path);
    if (location.hash === "#metrics") openOps();
  }
  try { window.claude?.hot?.snapshot?.(() => ({ stage: L && L.index, path: S && S.path })); } catch {}
  const hot = window.claude?.hot;
  hot?.ready ? hot.ready(boot) : boot(hot?.data ?? {});
})();
</script>
